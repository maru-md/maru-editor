name: Bug report
description: Something in Maru doesn't work as expected.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Press …
  - type: input
    id: version
    attributes:
      label: Maru version
      description: Settings → Version & Updates
      placeholder: "0.1.0"
  - type: dropdown
    id: where
    attributes:
      label: Where
      options: [Mac app, iPhone app, CLI (maru), MCP / agent plugin, Other]
  - type: input
    id: os
    attributes:
      label: macOS / iOS version
      placeholder: "macOS 27.0"
